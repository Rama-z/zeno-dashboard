openapi: 3.0.3
info:
  title: Zeno API
  version: 1.5.0
  description: API runtime untuk dashboard dan personal workspace Zeno.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      tags: [System]
      summary: Cek kesehatan API, database, dan source Markdown
      responses:
        '200': {description: Service sehat}
        '503': {description: Service degraded}
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register akun dan kirim email verifikasi
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses:
        '202': {description: Permintaan registrasi diterima}
        '400': {description: Input tidak valid}
        '429': {description: Terlalu banyak percobaan}
        '503': {description: Provider email belum dikonfigurasi}
  /api/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Aktifkan akun menggunakan token email sekali pakai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200': {description: Email berhasil diverifikasi}
        '400': {description: Token invalid, expired, atau sudah dipakai}
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login dengan email dan password setelah verifikasi
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200': {description: Login berhasil dan session cookie dibuat}
        '401': {description: Email atau password salah}
        '403': {description: Email belum diverifikasi}
        '429': {description: Terlalu banyak percobaan}
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Baca user dari session aktif
      responses:
        '200': {description: User aktif}
        '401': {description: Login diperlukan}
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Hapus session aktif dan cookie
      responses:
        '200': {description: Logout berhasil}
  /api/profile:
    put:
      tags: [Authentication]
      summary: Ubah display name user aktif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 2, maxLength: 80}
      responses:
        '200': {description: Profil diperbarui}
        '401': {description: Login diperlukan}
  /api/overview:
    get:
      tags: [Monitoring]
      summary: Ringkasan dan session entries terfilter
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [all, success, info], default: all}}
        - {in: query, name: query, schema: {type: string}}
      responses:
        '200':
          description: Ringkasan monitoring
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overview'}
  /api/logs:
    get:
      tags: [Monitoring]
      summary: Daftar session log
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [all, success, info], default: all}}
        - {in: query, name: query, schema: {type: string}}
      responses:
        '200': {description: Daftar log}
  /api/logs/{id}:
    get:
      tags: [Monitoring]
      summary: Detail session log
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Detail log
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Log'}
        '404': {description: Tidak ditemukan}
  /api/activity:
    get:
      tags: [Activity]
      summary: Audit activity user; admin melihat semua, user hanya miliknya
      responses:
        '200': {description: Daftar audit activity}
        '401': {description: Login diperlukan}
  /api/settings:
    get:
      tags: [Settings]
      summary: Baca workspace settings
      responses:
        '200': {description: Settings saat ini}
    put:
      tags: [Settings]
      summary: Ubah nama workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceName]
              properties:
                workspaceName: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {description: Settings tersimpan}
        '400': {description: Input tidak valid}
  /api/change-logs:
    get:
      tags: [Change Log]
      summary: Baca Change Log dari PostgreSQL
      responses:
        '200':
          description: Daftar Change Log terbaru lebih dahulu
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: {$ref: '#/components/schemas/ChangeLogEntry'}
    post:
      tags: [Change Log]
      summary: Simpan atau perbarui Change Log berdasarkan id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeLogInput'}
      responses:
        '201':
          description: Change Log tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeLogEntry'}
        '400': {description: Input tidak valid}
  /api/learning:
    get:
      tags: [Learning]
      summary: Baca learning journal
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
      responses:
        '200': {description: Learning entries}
    post:
      tags: [Learning]
      summary: Tambah learning entry
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningInput'}
      responses:
        '201':
          description: Entry dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearningEntry'}
        '400': {description: Input tidak valid}
  /api/learning/{id}:
    put:
      tags: [Learning]
      summary: Edit learning entry atau ubah status checklist
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningInput'}
      responses:
        '200': {description: Entry diperbarui}
        '400': {description: Input tidak valid}
        '404': {description: Entry tidak ditemukan}
    delete:
      tags: [Learning]
      summary: Hapus learning entry
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: date, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Entry dihapus}
        '404': {description: Entry tidak ditemukan}
  /api/learning-materials:
    get:
      tags: [Learning Materials]
      summary: Baca published English Grammar material summaries
      security: [{CookieAuth: []}]
      parameters:
        - {in: query, name: subjectId, schema: {type: string, example: english}}
        - {in: query, name: categoryId, schema: {type: string, example: grammar}}
        - {in: query, name: level, schema: {type: string, enum: [A1, A2, B1, B2, C1]}}
      responses:
        '200':
          description: Published material summaries with the current user's progress
          content:
            application/json:
              schema:
                type: object
                required: [materials]
                properties:
                  materials:
                    type: array
                    items: {$ref: '#/components/schemas/LearningMaterialSummary'}
        '400': {description: Filter tidak valid}
  /api/learning-materials/{id}:
    get:
      tags: [Learning Materials]
      summary: Baca structured content untuk satu published material
      security: [{CookieAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, maxLength: 120}}
      responses:
        '200':
          description: Full material content and current-user progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearningMaterial'}
        '404': {description: Material tidak ditemukan atau belum published}
  /api/learning-materials/{id}/progress:
    put:
      tags: [Learning Materials]
      summary: Simpan owner-scoped mastery and review snapshot
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, maxLength: 120}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningMaterialProgressInput'}
      responses:
        '200':
          description: Progress tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearningMaterialProgress'}
        '400': {description: Progress tidak valid}
        '401': {description: Login diperlukan}
        '404': {description: Material tidak ditemukan atau belum published}
        '409': {description: Content version sudah berubah}
  /api/doing/tasks:
    get:
      tags: [Doing]
      summary: List Complete Workspace tasks (all planned dates, including unscheduled)
      security: [{CookieAuth: []}]
      responses:
        '200':
          description: Owned tasks, or all tasks for admin
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: {type: array, items: {$ref: '#/components/schemas/DoingTask'}}
        '401': {description: Login required}
    post:
      tags: [Doing]
      summary: Create Complete Workspace task; legacy Overview reads the same row
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoingTaskInput'}
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DoingTask'}
        '400': {description: Invalid or unknown/read-only fields}
        '401': {description: Login required}
        '403': {description: CSRF token or origin invalid}
  /api/doing/tasks/{id}:
    get:
      tags: [Doing]
      summary: Get a task scoped to owner (admin may read any)
      security: [{CookieAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DoingTask'}
        '400': {description: Invalid ID}
        '401': {description: Login required}
        '404': {description: Missing or foreign task}
    put:
      tags: [Doing]
      summary: Replace all 23 fields and checklist (stable IDs)
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoingTaskInput'}
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DoingTask'}
        '400': {description: Invalid fields or checklist IDs}
        '401': {description: Login required}
        '403': {description: CSRF token or origin invalid}
        '404': {description: Missing or foreign task}
    delete:
      tags: [Doing]
      summary: Delete owned task by ID without date
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      responses:
        '200': {description: Deleted ID}
        '400': {description: Invalid ID}
        '401': {description: Login required}
        '403': {description: CSRF token or origin invalid}
        '404': {description: Missing or foreign task}
  /api/doing:
    get:
      tags: [Doing]
      summary: Baca task Doing berdasarkan tanggal opsional
      security: [{CookieAuth: []}]
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
      responses:
        '200': {description: Doing entries}
        '400': {description: Format tanggal tidak valid}
        '401': {description: Login diperlukan}
    post:
      tags: [Doing]
      summary: Tambah task Doing
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoingInput'}
      responses:
        '201': {description: Task dibuat}
        '400': {description: Input tidak valid}
        '401': {description: Login diperlukan}
        '403': {description: CSRF token atau origin tidak valid}
  /api/doing/{id}:
    put:
      tags: [Doing]
      summary: Edit task atau ubah status checklist
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoingInput'}
      responses:
        '200': {description: Task diperbarui}
        '400': {description: Input atau data task tidak valid}
        '401': {description: Login diperlukan}
        '403': {description: CSRF token atau origin tidak valid}
        '404': {description: Task tidak ditemukan}
    delete:
      tags: [Doing]
      summary: Hapus task Doing
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: date, required: true, schema: {type: string, format: date}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      responses:
        '200': {description: Task dihapus}
        '400': {description: ID atau format tanggal tidak valid}
        '401': {description: Login diperlukan}
        '403': {description: CSRF token atau origin tidak valid}
        '404': {description: Task tidak ditemukan}
  /api/workouts:
    get:
      tags: [Workout]
      summary: Baca workout berdasarkan tanggal opsional
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
      responses:
        '200': {description: Workout entries}
    post:
      tags: [Workout]
      summary: Tambah workout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutInput'}
      responses:
        '201': {description: Workout dibuat}
        '400': {description: Input tidak valid}
  /api/workouts/{id}:
    put:
      tags: [Workout]
      summary: Edit detail atau status workout
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutInput'}
      responses:
        '200': {description: Workout diperbarui}
        '404': {description: Workout tidak ditemukan}
    delete:
      tags: [Workout]
      summary: Hapus workout
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: date, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Workout dihapus}
        '404': {description: Workout tidak ditemukan}
  /api/workout-sessions:
    get:
      tags: [Workout]
      summary: Baca sesi workout milik user beserta gerakan dan set
      security: [{CookieAuth: []}]
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
        - {in: query, name: exercise, schema: {type: string, maxLength: 160}}
      responses:
        '200': {description: Sesi workout yang terfilter dan owner-scoped}
        '400': {description: Filter tidak valid}
        '401': {description: Login diperlukan}
    post:
      tags: [Workout]
      summary: Buat rencana sesi baru; hasil aktual dan timer selalu direset
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutSession'}
      responses:
        '201': {description: Rencana sesi dibuat}
        '400': {description: Input tidak valid}
        '401': {description: Login diperlukan}
        '403': {description: CSRF token atau origin tidak valid}
  /api/workout-sessions/{id}:
    put:
      tags: [Workout]
      summary: Simpan atomik status sesi, urutan gerakan, timer, dan hasil set
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutSession'}
      responses:
        '200': {description: Sesi workout diperbarui}
        '400': {description: Target, hasil aktual, atau status tidak valid}
        '404': {description: Sesi tidak ditemukan atau bukan milik user}
        '409': {description: Sesi sudah berubah; body updatedAt basi, muat ulang sebelum menyimpan}
    delete:
      tags: [Workout]
      summary: Hapus sesi workout milik user
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      responses:
        '200': {description: Sesi dihapus}
        '404': {description: Sesi tidak ditemukan atau bukan milik user}
  /api/workout-templates:
    get:
      tags: [Workout]
      summary: Baca template workout milik user
      security: [{CookieAuth: []}]
      responses:
        '200': {description: Template workout owner-scoped}
    post:
      tags: [Workout]
      summary: Simpan snapshot target sebagai template tanpa hasil aktual
      security: [{CookieAuth: [], CSRFToken: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutTemplate'}
      responses:
        '201': {description: Template workout dibuat}
        '400': {description: Template tidak valid}
  /api/journals:
    get:
      tags: [Journaling]
      summary: Baca arsip jurnal terbaru berdasarkan tanggal opsional
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
      responses:
        '200': {description: Latest journal snapshots including current content, without historical revision arrays}
    post:
      tags: [Journaling]
      summary: Simpan jurnal Markdown dan revision pertama secara atomik
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalInput'}
      responses:
        '201':
          description: Journal dibuat dengan revision 1
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalEntry'}
        '400': {description: Input tidak valid}
  /api/journals/{id}/revisions:
    get:
      tags: [Journaling]
      summary: Baca riwayat jurnal secara newest-first
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Semua immutable journal revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalRevisionHistory'}
        '404': {description: Journal tidak ditemukan atau bukan milik user}
    post:
      tags: [Journaling]
      summary: Tambah immutable journal revision dengan optimistic concurrency
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalRevisionInput'}
      responses:
        '201':
          description: Revision baru dan latest parent snapshot dibuat atomik
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalRevisionAppendResponse'}
        '400': {description: Input invalid atau tidak mengubah snapshot terbaru}
        '404': {description: Journal tidak ditemukan atau bukan milik user}
        '409': {description: baseRevisionNumber sudah stale}
  /api/journals/{id}:
    delete:
      tags: [Journaling]
      summary: Hapus logical journal beserta semua revisions melalui FK cascade
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Journal dan seluruh revisions dihapus}
        '404': {description: Journal tidak ditemukan}
  /api/spending:
    get:
      tags: [Spending]
      summary: Baca daftar pengeluaran berdasarkan tanggal opsional
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
      responses:
        '200': {description: Spending entries}
    post:
      tags: [Spending]
      summary: Tambah pengeluaran
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpendingInput'}
      responses:
        '201': {description: Pengeluaran dibuat}
        '400': {description: Input tidak valid}
  /api/spending/{id}:
    delete:
      tags: [Spending]
      summary: Hapus pengeluaran
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Pengeluaran dihapus}
        '404': {description: Pengeluaran tidak ditemukan}
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: zeno_session
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 72, format: password}
        displayName: {type: string, minLength: 2, maxLength: 80}
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {type: string, enum: [user, admin]}
        emailVerifiedAt: {type: string, format: date-time}
    Log:
      type: object
      required: [id, title, question, answer, excerpt, status]
      properties:
        id: {type: integer}
        title: {type: string}
        question: {type: string}
        answer: {type: string}
        excerpt: {type: string}
        status: {type: string, enum: [success, info]}
    Overview:
      type: object
      properties:
        totalEntries: {type: integer}
        visibleEntries: {type: integer}
        verifiedOutcomes: {type: integer}
        coverage: {type: integer}
        entries:
          type: array
          items: {$ref: '#/components/schemas/Log'}
        generatedAt: {type: string, format: date-time}
        sourceFile: {type: string}
    ChangeLogInput:
      type: object
      required: [occurredAt, title]
      properties:
        id: {type: string, maxLength: 120}
        occurredAt: {type: string, format: date-time}
        title: {type: string, maxLength: 160}
        description: {type: string, maxLength: 2000}
        category: {type: string, enum: [Frontend, Backend, DevOps, Hermes, General], default: General}
    ChangeLogEntry:
      allOf:
        - {$ref: '#/components/schemas/ChangeLogInput'}
        - type: object
          required: [id, createdAt]
          properties:
            id: {type: string}
            createdAt: {type: string, format: date-time}
    LearningInput:
      type: object
      required: [date, title]
      properties:
        date: {type: string, format: date}
        title: {type: string, maxLength: 160}
        note: {type: string, maxLength: 2000}
        category: {type: string, maxLength: 60, default: General}
        completed: {type: boolean, default: false}
    LearningEntry:
      allOf:
        - {$ref: '#/components/schemas/LearningInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
    LearningMaterialSummary:
      type: object
      required: [id, subjectId, categoryId, topicId, level, coverageMode, title, summary, contentVersion, published, reviewDue]
      properties:
        id: {type: string, maxLength: 120}
        subjectId: {type: string}
        subjectTitle: {type: string}
        categoryId: {type: string}
        categoryTitle: {type: string}
        topicId: {type: string}
        topicTitle: {type: string}
        locale: {type: string}
        level: {type: string, enum: [A1, A2, B1, B2, C1]}
        coverageMode: {type: string, enum: [lesson, awareness, planned]}
        title: {type: string}
        summary: {type: string}
        sequence: {type: integer}
        positionWithinTopic: {type: integer}
        estimatedMinutes: {type: integer}
        schemaVersion: {type: string}
        contentVersion: {type: integer}
        prerequisites: {type: array, items: {type: string}}
        revisits: {type: array, items: {type: string}}
        published: {type: boolean}
        progress: {$ref: '#/components/schemas/LearningMaterialProgress', nullable: true}
        reviewDue: {type: boolean}
    LearningMaterial:
      allOf:
        - {$ref: '#/components/schemas/LearningMaterialSummary'}
        - type: object
          required: [content, mastery, review]
          properties:
            content: {type: object, additionalProperties: true}
            mastery: {type: object, additionalProperties: true}
            review: {type: object, additionalProperties: true}
    LearningMaterialProgressInput:
      type: object
      required: [contentVersion, status, objectiveState, attemptCount]
      properties:
        materialId: {type: string, maxLength: 120, description: Optional consistency check; route id is authoritative}
        contentVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [in_progress, mastered]}
        masteryScore: {type: integer, minimum: 0, maximum: 100, nullable: true}
        objectiveState: {type: object, additionalProperties: {type: boolean}}
        attemptCount: {type: integer, minimum: 0}
        lastReviewedAt: {type: string, format: date-time, nullable: true}
        nextReviewAt: {type: string, format: date-time, nullable: true}
    LearningMaterialProgress:
      allOf:
        - {$ref: '#/components/schemas/LearningMaterialProgressInput'}
        - type: object
          required: [materialId, status, objectiveState, attemptCount, contentVersion, createdAt, updatedAt]
          properties:
            materialId: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    DoingTaskInput:
      type: object
      additionalProperties: false
      required: [title, area, project, type, status, priority, urgency, impact, effort, energy, focus, duration, context, device, location, timePreference, difficulty, resistance, nextAction, definitionOfDone]
      description: Due and plannedDate independently nullable; send null to clear. Existing legacy rows may have empty attributes and no criteria until explicitly completed in the editor.
      properties: &doingTaskFields
        title: {type: string, minLength: 1, maxLength: 160}
        area: {type: string, enum: ['💻 Personal Project', Work, Personal]}
        project: {type: string, minLength: 1, maxLength: 160}
        type: {type: string, enum: [Deep Work, Admin, Creative, Communication]}
        status: {type: string, enum: [Ready, In progress, Blocked, Done]}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        urgency: {type: string, enum: [Low, Normal, High]}
        impact: {type: string, enum: [Low, Medium, High]}
        effort: {type: string, enum: [Low, Medium, High]}
        energy: {type: string, enum: [Low, Medium, High]}
        focus: {type: string, enum: [Light, Moderate, Deep]}
        duration: {$ref: '#/components/schemas/DoingDurationInput'}
        context: {type: string, enum: ['@computer', '@home', '@office', '@errands']}
        device: {type: string, enum: [Laptop, Phone, Tablet, Any device]}
        location: {type: string, enum: [Anywhere, Home, Office, Library]}
        timePreference: {type: string, enum: [Morning, Afternoon, Evening, Anytime]}
        difficulty: {type: string, enum: [Low, Medium, High]}
        resistance: {type: string, enum: [Low, Medium, High]}
        due: {type: string, format: date, nullable: true}
        nextAction: {type: string, minLength: 1, maxLength: 500}
        definitionOfDone: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/DoingCriterionInput'}}
        plannedDate: {type: string, format: date, nullable: true}
        notes: {type: string, maxLength: 20000, description: Multiline whitespace preserved}
    DoingDurationInput:
      type: object
      additionalProperties: false
      required: [minMinutes, maxMinutes]
      description: 1 <= minMinutes <= maxMinutes <= 240. Response also includes a server-derived label.
      properties:
        minMinutes: {type: integer, minimum: 1, maximum: 240}
        maxMinutes: {type: integer, minimum: 1, maximum: 240}
    DoingDuration:
      type: object
      required: [minMinutes, maxMinutes, label]
      properties:
        minMinutes: {type: integer, minimum: 1, maximum: 240}
        maxMinutes: {type: integer, minimum: 1, maximum: 240}
        label: {type: string, readOnly: true, description: Server-derived duration range label}
    DoingCriterionInput:
      type: object
      additionalProperties: false
      required: [text, done]
      properties:
        id: {type: string, format: uuid, description: Omit for new item; on update must belong to this task. Order is array order.}
        text: {type: string, minLength: 1, maxLength: 500}
        done: {type: boolean}
    DoingCriterion:
      type: object
      required: [id, text, done]
      properties:
        id: {type: string, format: uuid}
        text: {type: string, maxLength: 500}
        done: {type: boolean}
    DoingTask:
      type: object
      description: Complete Workspace response; migrated legacy records can contain empty enums/criteria and expose legacyMetadata.
      properties:
        <<: *doingTaskFields
        duration: {$ref: '#/components/schemas/DoingDuration'}
        definitionOfDone: {type: array, items: {$ref: '#/components/schemas/DoingCriterion'}, description: Migrated legacy rows can have an empty checklist}
        id: {type: string, format: uuid}
        ownerUserId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        legacyMetadata: {type: object, additionalProperties: true, description: Read-only preserved source attributes for migrated legacy rows}
    DoingInput:
      type: object
      required: [date, title]
      properties:
        date: {type: string, format: date}
        title: {type: string, maxLength: 160}
        status: {type: string, enum: [todo, doing, blocked, done], default: todo}
        priority: {type: string, enum: [high, medium, low], default: medium}
        timeBlockStart: {type: string, pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Optional HH:MM start paired with timeBlockEnd}
        timeBlockEnd: {type: string, pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Optional HH:MM end after timeBlockStart}
        estimatedMinutes: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
        actualMinutes: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
        note: {type: string, maxLength: 2000}
        category: {type: string, maxLength: 60, default: General}
        project: {type: string, maxLength: 160}
        goalOutcome: {type: string, maxLength: 500}
        progress: {type: integer, minimum: 0, maximum: 100, default: 0}
        energyFocus: {type: string, enum: [deep, medium, light], default: medium}
        dependency: {type: string, maxLength: 500}
        blockedBy: {type: string, maxLength: 500}
        carryOver: {type: boolean, default: false}
        completed: {type: boolean, default: false, description: Backward-compatible mirror of status done}
    DoingEntry:
      allOf:
        - {$ref: '#/components/schemas/DoingInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            completedAt: {type: string, format: date-time, nullable: true, description: Set by the server while status is done}
            createdAt: {type: string, format: date-time}
    WorkoutInput:
      type: object
      required: [date, exercise]
      properties:
        date: {type: string, format: date}
        materialId: {type: string, nullable: true, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', description: Stable static Workout Material ID; preserved on update}
        exercise: {type: string, maxLength: 160}
        category: {type: string, maxLength: 60, default: General}
        sets: {type: integer, minimum: 0}
        reps: {type: integer, minimum: 0}
        durationMinutes: {type: integer, minimum: 0}
        note: {type: string, maxLength: 2000}
        completed: {type: boolean, default: false}
    WorkoutEntry:
      allOf:
        - {$ref: '#/components/schemas/WorkoutInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
    WorkoutSet:
      type: object
      required: [number, target, actual, status]
      properties:
        id: {type: string, format: uuid, description: Required on update; assigned by server on create}
        movementId: {type: string, format: uuid, readOnly: true}
        number: {type: integer, minimum: 1}
        target: {type: object, additionalProperties: true, description: Immutable target snapshot for this set}
        actual: {type: object, nullable: true, additionalProperties: true, description: Null until explicitly saved}
        status: {type: string, enum: [unrecorded, completed, skipped]}
        recordedAt: {type: string, format: date-time, nullable: true}
        rpe: {type: number, minimum: 1, maximum: 10, nullable: true}
    WorkoutMovement:
      type: object
      required: [name, exerciseType, position, target, status, sets]
      properties:
        id: {type: string, format: uuid, description: Required on update; assigned by server on create}
        sessionId: {type: string, format: uuid, readOnly: true}
        materialId: {type: string, maxLength: 120, nullable: true}
        custom: {type: boolean}
        name: {type: string, maxLength: 160}
        exerciseType: {type: string, enum: [strength, bodyweight, cardio, mobility, interval]}
        position: {type: integer, minimum: 1}
        equipment: {type: array, items: {type: string}}
        muscleGroups: {type: array, items: {type: string}}
        target: {type: object, additionalProperties: true, description: Type-specific planned target snapshot}
        restSeconds: {type: integer, minimum: 0, nullable: true}
        status: {type: string, enum: [planned, in_progress, completed, skipped]}
        note: {type: string, maxLength: 2000}
        sets: {type: array, items: {$ref: '#/components/schemas/WorkoutSet'}}
    WorkoutSession:
      type: object
      required: [name, date]
      properties:
        id: {type: string, format: uuid, description: Required on update; assigned by server on create}
        ownerUserId: {type: string, format: uuid, readOnly: true}
        name: {type: string, maxLength: 160}
        date: {type: string, format: date, description: Local calendar date}
        localTime: {type: string, pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        timezone: {type: string, maxLength: 80, default: Asia/Jakarta}
        status: {type: string, enum: [planned, in_progress, completed, partial, skipped], default: planned}
        estimatedMinutes: {type: integer, minimum: 0}
        startedAt: {type: string, format: date-time, nullable: true}
        pausedAt: {type: string, format: date-time, nullable: true}
        pausedSeconds: {type: integer, minimum: 0}
        endedAt: {type: string, format: date-time, nullable: true}
        restTimerEndsAt: {type: string, format: date-time, nullable: true}
        restTimerPausedRemainingSeconds: {type: integer, minimum: 0, nullable: true}
        location: {type: string, maxLength: 160}
        note: {type: string, maxLength: 2000}
        templateId: {type: string, format: uuid, nullable: true}
        legacyWorkoutEntryId: {type: string, format: uuid, readOnly: true, nullable: true}
        movements: {type: array, items: {$ref: '#/components/schemas/WorkoutMovement'}}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    WorkoutTemplate:
      type: object
      required: [name, movements]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        ownerUserId: {type: string, format: uuid, readOnly: true}
        name: {type: string, maxLength: 160}
        movements: {type: array, items: {$ref: '#/components/schemas/WorkoutMovement'}}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    JournalInput:
      type: object
      required: [date, title, content]
      properties:
        date: {type: string, format: date}
        title: {type: string, maxLength: 160}
        content: {type: string, maxLength: 50000, description: Markdown content}
        mood: {type: string, maxLength: 30, default: Neutral}
        tags: {type: string, maxLength: 500}
    JournalEntry:
      allOf:
        - {$ref: '#/components/schemas/JournalInput'}
        - type: object
          required: [id, createdAt, updatedAt, latestRevisionNumber]
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time, description: Original creation time}
            updatedAt: {type: string, format: date-time, description: Latest saved revision time}
            latestRevisionNumber: {type: integer, minimum: 1}
            latestEditReason: {$ref: '#/components/schemas/JournalEditReason'}
    JournalEditReason:
      type: string
      enum: [typo, clarify, incorrect_information, changed_my_mind]
    JournalRevisionInput:
      allOf:
        - {$ref: '#/components/schemas/JournalInput'}
        - type: object
          required: [baseRevisionNumber, editReason]
          properties:
            baseRevisionNumber: {type: integer, minimum: 1}
            editReason: {$ref: '#/components/schemas/JournalEditReason'}
    JournalRevision:
      allOf:
        - {$ref: '#/components/schemas/JournalInput'}
        - type: object
          required: [journalId, revisionNumber, createdAt]
          properties:
            journalId: {type: string, format: uuid}
            revisionNumber: {type: integer, minimum: 1}
            editReason: {$ref: '#/components/schemas/JournalEditReason'}
            createdAt: {type: string, format: date-time}
    JournalRevisionHistory:
      type: object
      required: [journalId, latestRevisionNumber, revisions]
      properties:
        journalId: {type: string, format: uuid}
        latestRevisionNumber: {type: integer, minimum: 1}
        revisions:
          type: array
          description: Newest revision first
          items: {$ref: '#/components/schemas/JournalRevision'}
    JournalRevisionAppendResponse:
      type: object
      required: [entry, revision]
      properties:
        entry: {$ref: '#/components/schemas/JournalEntry'}
        revision: {$ref: '#/components/schemas/JournalRevision'}
    SpendingInput:
      type: object
      required: [date, description, amount]
      properties:
        date: {type: string, format: date}
        description: {type: string, maxLength: 160}
        category: {type: string, maxLength: 60, default: Other}
        amount: {type: integer, format: int64, minimum: 1, description: Nominal rupiah utuh}
        paymentMethod: {type: string, maxLength: 60, default: Other}
        note: {type: string, maxLength: 2000}
    SpendingEntry:
      allOf:
        - {$ref: '#/components/schemas/SpendingInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
